<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Desi Rasoi | Menu</title>
      <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
      <style>
         /* Google Font */
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

         /* ===== GENERAL ===== */
         body {
         font-family:'Poppins',sans-serif;
         background: linear-gradient(135deg, #f4f6f9, #e9ecef);
         margin: 0;
         padding: 0;
         }
         /* Navbar */
.navbar-custom{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:1000;

    background:rgba(0,0,0,.90);
    backdrop-filter:blur(12px);

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:15px 40px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo img{
    width:55px;
    height:55px;
    border-radius:50%;
    border:2px solid #c59d5f;
}

.logo span{
    color:white;
    font-size:22px;
    font-weight:600;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:25px;
}

.nav-links a{
    color:#fff;
    text-decoration:none;
    font-weight:500;
    transition:.3s;
}

.nav-links a:hover{
    color:#c59d5f;
}

.menu-toggle{
    display:none;
    color:white;
    font-size:28px;
    cursor:pointer;
}
         /* ===== MENU TABLE ===== */
         .chefs-table {
         padding: 40px 20px;
         margin-top: 80px;
         }
         .table-responsive {
         box-shadow: 0 5px 20px rgba(0,0,0,0.1);
         border-radius: 10px;
         overflow: hidden;
         }
         .table {
         background: #fff;
         border: none;
         }
         .table thead {
         background-color: #000000;
         color: #fff;
         font-weight: 600;
         font-size: 16px;
         }
         .table th, .table td {
         text-align: center;
         vertical-align: middle !important;
         padding: 12px 15px;
         }
         .table tbody tr {
         transition: 0.3s;
         }
         .table tbody tr:hover {
         background: #fff0f0;
         transform: translateX(5px);
         }
         /* ===== BUTTONS ===== */
         .btn-order, .btn-cart {
         font-size: 14px;
         border-radius: 25px;
         padding: 6px 15px;
         transition: 0.3s;
         }
         .btn-order {
         background-color: #28a745;
         color: #fff;
         border: none;
         }
         .btn-order:hover {
         background-color: #218838;
         color: #fff;
         }
         .btn-cart {
         background-color: #ff9800;
         color: #fff;
         border: none;
         }
         .btn-cart:hover {
         background-color: #e68900;
         color: #fff;
         }
         /* ===== FOOTER ===== */
         .footer {
         background-color: #000000;
         color: #ccc;
         padding: 30px 20px;
         text-align: center;
         font-size: 14px;
         }
         .footer a {
         color: #c59d5f;
         margin: 0 5px;
         text-decoration: none;
         font-size: 18px;
         }
         .footer a:hover {
         color: #fff;
         }
         /* WhatsApp Icon */
         .footer .whatsapp-icon {
         color: #25D366;
         font-size: 20px;
         transition: transform 0.3s, color 0.3s;
         }
         .footer .whatsapp-icon:hover {
         transform: scale(1.2);
         color: #128C7E;
         }
   /* ===========================
    RESPONSIVE DESIGN
=========================== */
/* Mobile */
@media (max-width:768px){

    .navbar-custom{
      height:100px;
        padding:15px 20px;
    }

    .menu-toggle{
        display:block;
    }

    .nav-links{
    position:absolute;
    top:85px;
    left:0;
    width:100%;

    background:#111;

    display:flex;
    flex-direction:column;

    max-height:0;
    overflow:hidden;

    transition:.4s ease;
}

.nav-links.active{
    max-height:600px;
    padding:15px 0;
}

.nav-links a{
    width:100%;
    padding:15px;
    text-align:center;
    border-top:1px solid rgba(255,255,255,.08);
}

    .chefs-table{
        margin-top:110px;
        padding:20px 10px;
    }

    .table-responsive{
        overflow-x:auto;
        -webkit-overflow-scrolling:touch;
    }

    .table{
        min-width:700px;
    }

    .table th,
    .table td{
        white-space:nowrap;
        font-size:13px;
        padding:8px;
    }

    .btn-order,
    .btn-cart{
        width:100%;
        margin:3px 0;
        font-size:13px;
        padding:8px;
    }

    .footer{
        padding:25px 15px;
        font-size:13px;
    }

    .footer a{
        display:inline-block;
        margin:5px;
    }
}
      </style>
   </head>
   <body>
      <!-- NAVBAR -->
     <div class="navbar-custom">
    <div class="logo">
        <a href="#homescreen">
            <img src="{{ url_for('static', filename='images/desi_logo.jpeg') }}">
        </a>
        <span>Desi Rasoi</span>
    </div>

    <!-- Hamburger -->
    <div class="menu-toggle" id="menuToggle">
        <i class="fas fa-bars"></i>
    </div>

    <!-- Links -->
    <div class="nav-links" id="navLinks">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('menu') }}">Menu</a>
        <a href="{{ url_for('reservation') }}">Reservation</a>
        <a href="{{ url_for('cart') }}">Cart</a>
        <a href="{{ url_for('contact') }}">Contact</a>
        <a href="{{ url_for('reviews') }}">Reviews</a>
    </div>
</div>
      <!-- MENU TABLE -->
      <div class="chefs-table container">
         <div class="table-responsive">
            <table class="table table-hover">
               <thead>
                  <tr>
                     <th>#</th>
                     <th>Dish Name</th>
                     <th>Quantity</th>
                     <th>Price</th>
                     <th>Order</th>
                     <th>Cart</th>
                  </tr>
               </thead>
               <tbody id="menu-list">
                  <tr>
                     <td colspan="6">
                        <strong>Loading Dishes...</strong>
                     </td>
                  </tr>
               </tbody>
            </table>
         </div>
      </div>
      <!-- FOOTER -->
      <div class="footer">
         <p>&copy; 2026 <strong>Desi Rasoi</strong>. All Rights Reserved.</p>
         <p>📞 +92 333-1234567 </p>
         <p>📧 dasirasoireturant@gmail.com</p>
         <p>📍 123 Food Street, Rawalpindi, Pakistan</p>
         <p>
            <a href="https://wa.me/#" target="_blank" class="whatsapp-icon"><i class="fab fa-whatsapp"></i> Whatsapp</a>
         </p>
      </div>
      <script>
document.addEventListener("DOMContentLoaded", function () {
    const tbody = document.getElementById("menu-list");

    if (tbody) {
        async function fetchMenu() {
            try {
                const res = await fetch("/fetch_menu", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        // "x-api-key": "MY-SECRET-CODE-IS-CLIENT-KEY@2004"
                        "x-api-key": "{{ api_key }}"
                    }
                });

                const data = await res.json();
                console.log("Menu Response:", data);

                if (String(data.success) === "1" && Array.isArray(data.data)) {
                    const menu = data.data;
                    tbody.innerHTML = "";

                    menu.forEach((item) => {
                        const row = document.createElement("tr");

                        row.innerHTML = `
                            <td>${item.id}</td>
                            <td>${item.dish_name}</td>
                            <td>${item.quantity}</td>
                            <td>${item.price}</td>
                            <td><a href="{{ url_for('order') }}" class="btn btn-order">Order</a></td>
                            <td><a href="{{ url_for('cart') }}" class="btn btn-cart">Add to Cart</a></td>
                        `;

                        tbody.appendChild(row);
                    });

                } else {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="6"><strong>No Data Found</strong></td>
                        </tr>
                    `;
                }

            } catch (error) {
                console.error("Error fetching menu:", error);
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6"><strong>Error loading menu</strong></td>
                    </tr>
                `;
            }
        }

        fetchMenu(); // function call
    }
});
const menuToggle = document.getElementById("menuToggle");
const navLinks = document.getElementById("navLinks");

menuToggle.addEventListener("click", () => {

    navLinks.classList.toggle("active");

    const icon = menuToggle.querySelector("i");

    if(navLinks.classList.contains("active")){
        icon.classList.remove("fa-bars");
        icon.classList.add("fa-times");
    }else{
        icon.classList.remove("fa-times");
        icon.classList.add("fa-bars");
    }

});

document.querySelectorAll(".nav-links a").forEach(link=>{

    link.addEventListener("click",()=>{

        navLinks.classList.remove("active");

        const icon = menuToggle.querySelector("i");
        icon.classList.remove("fa-times");
        icon.classList.add("fa-bars");

    });

});
</script>
   </body>
</html>
