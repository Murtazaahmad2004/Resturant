<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Desi Rasoi | Menu</title>
      <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
      <style>
         /* Google Font */
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

         /* ===== GENERAL ===== */
         body {
         font-family:'Poppins',sans-serif;
         background: linear-gradient(135deg, #f4f6f9, #e9ecef);
         margin: 0;
         padding: 0;
         }
         .navbar-custom {
         background-color: #000000;
         padding: 15px 40px;
         width: 100%;
         z-index: 1000;
         position: fixed;   /* ✅ change */
         top: 0;            /* ✅ important */
         left: 0;
         display: flex;
         justify-content: space-between; /* menu-title left, links right */
         align-items: center;
         flex-wrap: wrap;
         }
         .navbar-custom .menu-title {
         color: white;
         font-size: 24px;
         font-weight: 600;
         display: flex;
         align-items: center;
         gap: 10px; /* space between icon and text */
         }
         .nav-links {
         display: flex;
         gap: 25px;
         }
         .nav-links a {
         color: white;
         font-weight: 500;
         text-decoration: none;
         transition: 0.3s;
         }
         .nav-links a:hover {
         color: #ffffff;
         }
         /* ===== MENU TABLE ===== */
         .chefs-table {
         padding: 40px 20px;
         margin-top: 80px;
         }
         .table-responsive {
         box-shadow: 0 5px 20px rgba(0,0,0,0.1);
         border-radius: 10px;
         overflow: hidden;
         }
         .table {
         background: #fff;
         border: none;
         }
         .table thead {
         background-color: #000000;
         color: #fff;
         font-weight: 600;
         font-size: 16px;
         }
         .table th, .table td {
         text-align: center;
         vertical-align: middle !important;
         padding: 12px 15px;
         }
         .table tbody tr {
         transition: 0.3s;
         }
         .table tbody tr:hover {
         background: #fff0f0;
         transform: translateX(5px);
         }
         /* ===== BUTTONS ===== */
         .btn-order, .btn-cart {
         font-size: 14px;
         border-radius: 25px;
         padding: 6px 15px;
         transition: 0.3s;
         }
         .btn-order {
         background-color: #28a745;
         color: #fff;
         border: none;
         }
         .btn-order:hover {
         background-color: #218838;
         color: #fff;
         }
         .btn-cart {
         background-color: #ff9800;
         color: #fff;
         border: none;
         }
         .btn-cart:hover {
         background-color: #e68900;
         color: #fff;
         }
         /* ===== FOOTER ===== */
         .footer {
         background-color: #000000;
         color: #ccc;
         padding: 30px 20px;
         text-align: center;
         font-size: 14px;
         }
         .footer a {
         color: #c59d5f;
         margin: 0 5px;
         text-decoration: none;
         font-size: 18px;
         }
         .footer a:hover {
         color: #fff;
         }
         /* WhatsApp Icon */
         .footer .whatsapp-icon {
         color: #25D366;
         font-size: 20px;
         transition: transform 0.3s, color 0.3s;
         }
         .footer .whatsapp-icon:hover {
         transform: scale(1.2);
         color: #128C7E;
         }
         /* ===== RESPONSIVE ===== */
         @media(max-width:768px){
         .table th, .table td {
         font-size: 13px;
         padding: 8px 10px;
         }
         }
      </style>
   </head>
   <body>
      <!-- NAVBAR -->
      <div class="navbar-custom">
         <div class="menu-title">
            <i class="fas fa-utensils"></i> Menu List
         </div>
         <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('menu') }}">Menu</a>
            <a href="{{ url_for('reservation') }}">Reservation</a>
            <a href="{{ url_for('contact') }}">Contact</a>
            <a href="{{ url_for('reviews') }}">Reviews</a>
            <a href="{{ url_for('cart') }}">Cart</a>
         </div>
      </div>
      <!-- MENU TABLE -->
      <div class="chefs-table container">
         <div class="table-responsive">
            <table class="table table-hover">
               <thead>
                  <tr>
                     <th>#</th>
                     <th>Dish Name</th>
                     <th>Quantity</th>
                     <th>Price</th>
                     <th>Order</th>
                     <th>Cart</th>
                  </tr>
               </thead>
               <tbody id="menu-list">
                  <tr>
                     <td colspan="6">
                        <strong>Loading Dishes...</strong>
                     </td>
                  </tr>
               </tbody>
            </table>
         </div>
      </div>
      <!-- FOOTER -->
      <div class="footer">
         <p>&copy; 2026 <strong>Desi Rasoi</strong>. All Rights Reserved.</p>
         <p>📞 +92 333-1234567 </p>
         <p>📧 dasirasoireturant@gmail.com</p>
         <p>📍 123 Food Street, Rawalpindi, Pakistan</p>
         <p>
            <a href="https://wa.me/#" target="_blank" class="whatsapp-icon"><i class="fab fa-whatsapp"></i> Whatsapp</a>
         </p>
      </div>
      <script>
document.addEventListener("DOMContentLoaded", function () {
    const tbody = document.getElementById("menu-list");

    if (tbody) {
        async function fetchMenu() {
            try {
                const res = await fetch("/fetch_menu", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    }
                });

                const data = await res.json();
                console.log("Menu Response:", data);

                if (String(data.success) === "1" && Array.isArray(data.data)) {
                    const menu = data.data;
                    tbody.innerHTML = "";

                    menu.forEach((item) => {
                        const row = document.createElement("tr");

                        row.innerHTML = `
                            <td>${item.id}</td>
                            <td>${item.dish_name}</td>
                            <td>${item.quantity}</td>
                            <td>${item.price}</td>
                            <td><a href="{{ url_for('order') }}" class="btn btn-order">Order</a></td>
                            <td><a href="{{ url_for('cart') }}" class="btn btn-cart">Add to Cart</a></td>
                        `;

                        tbody.appendChild(row);
                    });

                } else {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="6"><strong>No Data Found</strong></td>
                        </tr>
                    `;
                }

            } catch (error) {
                console.error("Error fetching menu:", error);
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6"><strong>Error loading menu</strong></td>
                    </tr>
                `;
            }
        }

        fetchMenu(); // function call
    }
});
</script>
   </body>
</html>
