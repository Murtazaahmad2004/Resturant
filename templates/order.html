<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <title>Order Management</title>
    <style>
        body {
            background-image: url('static/images/15.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        .navbar {
            background-color: #333;
            color: white;
            padding: 10px;
            text-align: center;
            font-size: 24px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
        }

        .container {
            margin-top: 100px;
            max-width: 700px;
            padding: 30px;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        label {
            font-weight: 600;
            margin-top: 10px;
        }

        .form-control {
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        .form-control:focus {
            border-color: #007bff;
            box-shadow: 0 0 6px rgba(0, 123, 255, 0.4);
        }

        .btn {
            margin-top: 10px;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 6px;
        }

        .btn-primary {
            background-color: #007bff;
            border: none;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }

        .hidden {
            display: none;
        }

        .footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 50px;
            position: static;
        }

        .footer p {
            margin: 0;
        }
    </style>
<script>
    function toggleTransactionID() {
        var paymentMethod = document.getElementById("payment_mtd").value;
        var transactionField = document.getElementById("transaction_id_field");

        if (paymentMethod === "Credit Card" || paymentMethod === "Debit Card") {
            transactionField.classList.remove("hidden");
        } else {
            transactionField.classList.add("hidden");
        }
    }
</script>
</head>
<body>
    <div class="navbar">
        <h2>Order Management</h2>
    </div>
<div class="container">
    <form method="POST" action="/order">
    <h3>Order Details</h3>
    
    <label for="orderid">Order ID:</label>
    <input type="text" id="orderid" name="orderid" class="form-control" value="{{ orderid }}" readonly>

    <label for="customerid">Customer ID:</label>
    <input type="text" id="customerid" name="customerid" class="form-control" value="{{ customerid }}" readonly>

    <label for="customername">Customer Name:</label>
    <input type="text" id="customername" name="customername" class="form-control" placeholder="Enter Customer Name" required>

    <label for="orderdate">Order Date:</label>
    <input type="date" id="orderdate" name="orderdate" class="form-control" placeholder="Enter Order Date" required>

    <label for="address">Address:</label>
    <input type="text" id="address" name="address" class="form-control" placeholder="Enter your Address" required>

    <label for="quantity">Quantity:</label>
    <input type="number" id="quantity" name="quantity" class="form-control" placeholder="Enter Quantity" required>

    <label for="productname">Product Name:</label>
    <input type="text" id="productname" name="productname" class="form-control" placeholder="Enter Product Name" required>

    <label for="price">Price:</label>
    <input type="number" id="price" name="price" class="form-control" placeholder="Enter Price" required>

    <label for="delivery">Delivery:</label>
    <select id="delivery" name="delivery" class="form-control" required>
        <option value="Home Delivery">Home Delivery</option>
        <option value="PickUP">PickUP</option>
    </select>

    <label for="payment_sts">Payment Status</label>
    <select id="payment_sts" name="payment_sts" class="form-control" required>
        <option value="confirmed">Confirmed</option>
        <option value="pending">Pending</option>
        <option value="cancelled">Cancelled</option>
    </select>

    <label for="promo_code">Promo Code:</label>
    <input type="text" id="promo_code" name="promo_code" class="form-control" placeholder="Enter Promo Code">

    <label for="payment_mtd">Payment:</label>
    <select id="payment_mtd" name="payment_mtd" class="form-control" onchange="toggleTransactionID()" required>
        <option value="Cash">Cash</option>
        <option value="Credit Card">Credit Card</option>
        <option value="Debit Card">Debit Card</option>
    </select>

    <div id="transaction_id_field" class="hidden">
        <label for="trans_id">Transaction ID:</label>
        <input type="text" id="trans_id" name="trans_id" class="form-control" value="{{ trans_id }}" readonly>
    </div><br>

    <button type="submit" class="btn btn-primary">Submit Order</button>
</form>
</div>

</body>
</html>
