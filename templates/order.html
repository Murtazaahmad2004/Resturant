<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap + Icons -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <title>Desi Rasoi | Order</title>

    <style>
        /* Google Font */
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

        body {
            background: linear-gradient(135deg, #f4f6f9, #e9ecef);
            font-family:'Poppins',sans-serif;
        }

        /* NAVBAR */
.navbar-custom {
         background-color: #000000;
         padding: 15px 40px;
         width: 100%;
         z-index: 1000;
         position: fixed;   /* ✅ change */
         top: 0;            /* ✅ important */
         left: 0;
         display: flex;
         justify-content: space-between; /* menu-title left, links right */
         align-items: center;
         flex-wrap: wrap;
         }
         .navbar-custom .menu-title {
         color: white;
         font-size: 24px;
         font-weight: 600;
         display: flex;
         align-items: center;
         gap: 10px; /* space between icon and text */
         }
         .nav-links {
         display: flex;
         gap: 25px;
         }
         .nav-links a {
         color: white;
         font-weight: 500;
         text-decoration: none;
         transition: 0.3s;
         }
         .nav-links a:hover {
         color: #ffffff;
         }

.custom-container {
    max-width: 700px;
    margin-top: 100px;
}

.form-card {
    max-width: 650px;
    margin: 40px auto;
    background: #fff;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

.section-title {
    font-size: 18px;
    font-weight: 700;
    margin-top: 20px;
    margin-bottom: 10px;
    color: #000000;
    border-left: 4px solid #000000;
    padding-left: 10px;
}

.input-group {
    margin-top: 12px;
}

.input-group-addon {
    background: #000000;
    color: white;
    border: none;
}

.form-control {
    margin-top: 10px;
    border-radius: 6px;
}

.btn-primary {
    background: linear-gradient(45deg, #000000, #100f0f);
    border: none;
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border-radius: 8px;
    margin-top: 25px;
}

        h3 {
            margin-bottom: 20px;
            color: #2c3e50;
        }

        label {
            margin-top: 10px;
        }

        .btn-primary:hover {
            background: #393b39;
        }

        .input-group .btn {
            background: #3498db;
            color: #fff;
        }

        .hidden {
            display: none;
        }

        /* CARD */
.form-card {
    max-width: 650px;
    margin: 40px auto;
    background: #fff;
    padding: 35px;
    margin-top: 40px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

        /* ===== FOOTER ===== */
.footer {
    background: #000000;
    color: #ccc;
    padding: 30px 20px;
    text-align: center;
    font-size: 14px;
    margin-top: 90px;
}

.footer a {
    color: #c59d5f;
    margin: 0 5px;
    text-decoration: none;
    font-size: 18px;
}

.footer a:hover {
    color: #fff;
}

/* WhatsApp Icon */
.footer .whatsapp-icon {
    color: #25D366;
    font-size: 20px;
    transition: transform 0.3s, color 0.3s;
}

.footer .whatsapp-icon:hover {
    transform: scale(1.2);
    color: #128C7E;
}
    </style>
</head>

<body>

<!-- NAVBAR -->
      <div class="navbar-custom">
         <div class="menu-title">
            <i class="fas fa-utensils"></i> Order Management
         </div>
         <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('menu') }}">Menu</a>
            <a href="{{ url_for('reservation') }}">Reservation</a>
            <a href="{{ url_for('contact') }}">Contact</a>
            <a href="{{ url_for('reviews') }}">Reviews</a>
            <a href="{{ url_for('cart') }}">Cart</a>
         </div>
      </div>

<div class="container custom-container">

    <div class="form-card">

        <form method="POST" action="/order">

            <!-- CUSTOMER INFO -->
            <div class="section-title">Customer Information</div>

            <div class="row">
                <div class="col-md-6">
                    <div class="input-group">
                        <span class="input-group-addon"><i class="fa fa-id-badge"></i></span>
                        <input type="text" name="orderid" class="form-control" value="{{ orderid }}" readonly>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="input-group">
                        <span class="input-group-addon"><i class="fa fa-id-card"></i></span>
                        <input type="text" name="customerid" class="form-control" value="{{ customerid }}" readonly>
                    </div>
                </div>
            </div>

            <div class="input-group">
                <span class="input-group-addon"><i class="fa fa-user"></i></span>
                <input type="text" name="customername" class="form-control" placeholder="Customer Name" required>
            </div>

            <div class="input-group">
                <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                <input type="date" name="orderdate" class="form-control" required>
            </div>

            <div class="input-group">
                <span class="input-group-addon"><i class="fa fa-map-marker"></i></span>
                <input type="text" name="address" class="form-control" placeholder="Address" required>
            </div>

            <!-- Dynamic Menu -->
            <div class="section-title">Order Details</div>

            <div class="input-group">
                <span class="input-group-addon"><i class="fa fa-utensils"></i></span>
                <select id="productname" name="productname" class="form-control" onchange="setPrice()" required>
                    <option>Loading...</option>
                </select>
            </div>

            <!-- Quantity -->
            <div class="input-group">
                <span class="input-group-addon">Qty</span>
                <input type="number" id="quantity" name="quantity" value="1" min="1" class="form-control" onchange="updateTotal()">
            </div>

            <!-- Price -->
            <div class="input-group">
                <span class="input-group-addon"><i class="fa fa-money-bill"></i></span>
                <input type="number" id="price" name="price" class="form-control" readonly placeholder="Total Price">
            </div>

            <!-- PAYMENT -->
            <div class="section-title">Payment Details</div>
            
            <div class="input-group">
                <span class="input-group-addon"><i class="fa fa-location-dot"></i></span>
                <select name="delivery" class="form-control">
                <option>Home Delivery</option>
                <option>PickUP</option>
            </select>
            </div>

            <div class="input-group">
                <span class="input-group-addon"><i class="fa fa-money-bill"></i></span>
                <select id="payment_mtd" name="payment_mtd" class="form-control" onchange="toggleTransaction()">
                    <option value="Cash">Cash</option>
                    <option value="JazzCash">JazzCash</option>
                    <option value="EasyPaisa">EasyPaisa</option>
                </select>
            </div>

        <div id="transaction_id_field" style="display:none;">
            <div class="input-group">
                <span class="input-group-addon"><i class="fa fa-receipt"></i></span>
                <input type="text" name="trans_id" class="form-control" value="{{ trans_id }}" readonly>
            </div>
        </div>

            <button type="submit" class="btn btn-primary">
                🚀 Place Order
            </button>

        </form>

    </div>
</div>

<!-- FOOTER -->
<div class="footer">
<p>&copy; 2026 <strong>Desi Rasoi</strong>. All Rights Reserved.</p>
<p>📞 +92 333-1234567 </p>
<p>📧 dasirasoireturant@gmail.com</p>
<p>📍 123 Food Street, Rawalpindi, Pakistan</p>
<p>
<a href="https://wa.me/#" target="_blank" class="whatsapp-icon"><i class="fab fa-whatsapp"></i> Whatsapp</a>
</p>
</div>

<script>
    $(document).ready(function(){
    loadMenu();
});

// 🔹 Load Menu from DB
function loadMenu(){
    $.ajax({
        url: "/fetch_menu",
        type: "POST",
        success: function(res){
            let dropdown = $("#productname");
            dropdown.empty();

            if(res.success === 1){
                dropdown.append('<option value="">Select Dish</option>');

                res.data.forEach(item => {
                    dropdown.append(
                        `<option value="${item.name}" data-price="${item.price}">
                        ${item.dish_name} - Rs.${item.price} (${item.quantity})
                        </option>`
                    );
                });
            }
        }
    });
}

// 🔹 Set Price
function setPrice(){
    let price = $("#productname option:selected").data("price");
    let qty = $("#quantity").val();

    if(price){
        $("#price").val(price * qty);
    }
}

    function changeQty(val) {
        let qtyInput = document.getElementById("quantity");
        let qty = parseInt(qtyInput.value) + val;
        if (qty >= 1) {
            qtyInput.value = qty;
            updateTotal();
        }
    }

    function toggleTransaction() {
        let method = document.getElementById("payment_mtd").value;
        let field = document.getElementById("transaction_id_field");
        let input = document.querySelector('[name="trans_id"]');

        if (method === "JazzCash" || method === "EasyPaisa") {
            field.style.display = "block";
        } else {
            field.style.display = "none";
        }
    }

    $("form").submit(function(){
        $(".btn-primary").html("Processing...").prop("disabled", true);
    });
</script>

</body>
</html>
